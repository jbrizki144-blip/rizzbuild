name: Web2APK

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: 'URL Website'
        required: true
      app_name:
        description: 'Nama Aplikasi'
        required: true
      icon_url:
        description: 'Icon Url'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Create Flutter Project
        run: |
          APP_NAME="${{ github.event.inputs.app_name }}"
          PKG=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]' | tr ' ' '_' | tr -cd '[:alnum:]_')
          flutter create --org com.webapk --project-name "$PKG" myapp

      - name: Add Assets and Dependencies
        run: |
          cd myapp
          # Pin versions so repeated builds use the same WebView stack.
          flutter pub add webview_flutter:4.13.0
          flutter pub add flutter_launcher_icons:0.14.4
          flutter pub add connectivity_plus:6.1.4

          # Menambahkan konfigurasi assets ke baris paling bawah untuk menghindari error indentasi YAML
          echo "  assets:" >> pubspec.yaml
          echo "    - assets/icon/" >> pubspec.yaml

      - name: Write main.dart
        run: |
          APP_NAME="${{ github.event.inputs.app_name }}"
          WEB_URL="${{ github.event.inputs.web_url }}"

          cat > myapp/lib/main.dart << 'DART'
          import 'dart:async';

          import 'package:connectivity_plus/connectivity_plus.dart';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();

            SystemChrome.setEnabledSystemUIMode(
              SystemUiMode.edgeToEdge,
            );

            SystemChrome.setSystemUIOverlayStyle(
              const SystemUiOverlayStyle(
                statusBarColor: Colors.transparent,
                systemNavigationBarColor: Colors.transparent,
                statusBarIconBrightness: Brightness.dark,
                systemNavigationBarIconBrightness: Brightness.dark,
                systemNavigationBarDividerColor: Colors.transparent,
              ),
            );

            runApp(const MyApp());
          }

          class MyApp extends StatelessWidget {
            const MyApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: r'$APP_NAME',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  useMaterial3: true,
                  colorSchemeSeed: Colors.blue,
                ),
                home: const SplashScreen(),
              );
            }
          }

          class SplashScreen extends StatefulWidget {
            const SplashScreen({super.key});

            @override
            State<SplashScreen> createState() => _SplashScreenState();
          }

          class _SplashScreenState extends State<SplashScreen>
              with TickerProviderStateMixin {
            late final AnimationController _fadeController;
            late final AnimationController _scaleController;
            late final AnimationController _dotController;
            late final Animation<double> _fadeAnim;
            late final Animation<double> _scaleAnim;
            late final Animation<double> _dot1Anim;
            late final Animation<double> _dot2Anim;
            late final Animation<double> _dot3Anim;

            bool _isChecking = false;
            bool _dialogShown = false;
            Timer? _startupTimer;

            @override
            void initState() {
              super.initState();

              _fadeController = AnimationController(
                vsync: this,
                duration: const Duration(milliseconds: 450),
              );

              _scaleController = AnimationController(
                vsync: this,
                duration: const Duration(milliseconds: 450),
              );

              _dotController = AnimationController(
                vsync: this,
                duration: const Duration(milliseconds: 900),
              )..repeat();

              _fadeAnim = CurvedAnimation(
                parent: _fadeController,
                curve: Curves.easeOut,
              );

              _scaleAnim = Tween<double>(
                begin: 0.90,
                end: 1.0,
              ).animate(
                CurvedAnimation(
                  parent: _scaleController,
                  curve: Curves.easeOutCubic,
                ),
              );

              _dot1Anim = TweenSequence<double>([
                TweenSequenceItem(
                  tween: Tween(begin: 0.35, end: 1.0),
                  weight: 1,
                ),
                TweenSequenceItem(
                  tween: Tween(begin: 1.0, end: 0.35),
                  weight: 1,
                ),
                TweenSequenceItem(
                  tween: ConstantTween(0.35),
                  weight: 1,
                ),
              ]).animate(
                CurvedAnimation(
                  parent: _dotController,
                  curve: Curves.easeInOut,
                ),
              );

              _dot2Anim = TweenSequence<double>([
                TweenSequenceItem(
                  tween: ConstantTween(0.35),
                  weight: 1,
                ),
                TweenSequenceItem(
                  tween: Tween(begin: 0.35, end: 1.0),
                  weight: 1,
                ),
                TweenSequenceItem(
                  tween: Tween(begin: 1.0, end: 0.35),
                  weight: 1,
                ),
              ]).animate(
                CurvedAnimation(
                  parent: _dotController,
                  curve: Curves.easeInOut,
                ),
              );

              _dot3Anim = TweenSequence<double>([
                TweenSequenceItem(
                  tween: Tween(begin: 1.0, end: 0.35),
                  weight: 1,
                ),
                TweenSequenceItem(
                  tween: ConstantTween(0.35),
                  weight: 1,
                ),
                TweenSequenceItem(
                  tween: Tween(begin: 0.35, end: 1.0),
                  weight: 1,
                ),
              ]).animate(
                CurvedAnimation(
                  parent: _dotController,
                  curve: Curves.easeInOut,
                ),
              );

              _fadeController.forward();
              _scaleController.forward();

              // Keep the splash short without adding unnecessary delays.
              _startupTimer = Timer(
                const Duration(milliseconds: 850),
                _checkConnectionAndNavigate,
              );
            }

            Future<void> _checkConnectionAndNavigate() async {
              if (_isChecking || !mounted) return;

              setState(() {
                _isChecking = true;
              });

              try {
                final results = await Connectivity().checkConnectivity();

                final hasNetwork = results.any(
                  (result) => result != ConnectivityResult.none,
                );

                if (!hasNetwork) {
                  if (!mounted) return;
                  setState(() {
                    _isChecking = false;
                  });
                  _showNoConnectionDialog();
                  return;
                }

                if (!mounted) return;

                Navigator.of(context).pushReplacement(
                  PageRouteBuilder(
                    transitionDuration: const Duration(milliseconds: 180),
                    reverseTransitionDuration:
                        const Duration(milliseconds: 120),
                    pageBuilder: (_, __, ___) => const WebViewPage(),
                    transitionsBuilder: (_, animation, __, child) {
                      return FadeTransition(
                        opacity: animation,
                        child: child,
                      );
                    },
                  ),
                );
              } catch (_) {
                if (!mounted) return;
                setState(() {
                  _isChecking = false;
                });
                _showNoConnectionDialog();
              }
            }

            void _showNoConnectionDialog() {
              if (!mounted || _dialogShown) return;

              setState(() {
                _dialogShown = true;
              });

              showDialog<void>(
                context: context,
                barrierDismissible: false,
                builder: (dialogContext) => AlertDialog(
                  shape: RoundedRectangleBorder(
                    borderRadius: BorderRadius.circular(16),
                  ),
                  title: const Row(
                    children: [
                      Icon(Icons.wifi_off, color: Colors.red),
                      SizedBox(width: 8),
                      Text('Gagal Terhubung'),
                    ],
                  ),
                  content: const Text(
                    'Tidak ada koneksi internet. Periksa jaringan kamu dan coba lagi.',
                  ),
                  actions: [
                    TextButton(
                      onPressed: () {
                        Navigator.of(dialogContext).pop();
                        if (!mounted) return;

                        setState(() {
                          _dialogShown = false;
                        });

                        _checkConnectionAndNavigate();
                      },
                      child: const Text('Coba Lagi'),
                    ),
                  ],
                ),
              );
            }

            Widget _buildDot(
              Animation<double> animation,
              Color color,
            ) {
              return AnimatedBuilder(
                animation: animation,
                builder: (_, __) {
                  return Opacity(
                    opacity: animation.value,
                    child: Container(
                      width: 7,
                      height: 7,
                      decoration: BoxDecoration(
                        color: color,
                        shape: BoxShape.circle,
                      ),
                    ),
                  );
                },
              );
            }

            @override
            void dispose() {
              _startupTimer?.cancel();
              _fadeController.dispose();
              _scaleController.dispose();
              _dotController.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SizedBox.expand(
                  child: DecoratedBox(
                    decoration: const BoxDecoration(
                      gradient: LinearGradient(
                        begin: Alignment.topLeft,
                        end: Alignment.bottomRight,
                        colors: [
                          Color(0xFFF0F4FF),
                          Color(0xFFE8F5E9),
                        ],
                      ),
                    ),
                    child: FadeTransition(
                      opacity: _fadeAnim,
                      child: Column(
                        mainAxisAlignment: MainAxisAlignment.center,
                        children: [
                          ScaleTransition(
                            scale: _scaleAnim,
                            child: Container(
                              width: 140,
                              height: 140,
                              decoration: BoxDecoration(
                                borderRadius: BorderRadius.circular(32),
                                boxShadow: [
                                  BoxShadow(
                                    color: Colors.black.withOpacity(0.15),
                                    blurRadius: 30,
                                    offset: const Offset(0, 10),
                                  ),
                                ],
                              ),
                              child: ClipRRect(
                                borderRadius: BorderRadius.circular(32),
                                child: Image.asset(
                                  'assets/icon/icon.png',
                                  fit: BoxFit.cover,
                                  errorBuilder: (_, __, ___) {
                                    return const Icon(
                                      Icons.android,
                                      size: 80,
                                      color: Colors.green,
                                    );
                                  },
                                ),
                              ),
                            ),
                          ),
                          const SizedBox(height: 28),
                          const Text(
                            r'$APP_NAME',
                            style: TextStyle(
                              fontSize: 26,
                              fontWeight: FontWeight.w700,
                              color: Color(0xFF1A1A2E),
                              letterSpacing: 0.5,
                            ),
                          ),
                          const SizedBox(height: 34),
                          Row(
                            mainAxisAlignment: MainAxisAlignment.center,
                            children: [
                              _buildDot(
                                _dot1Anim,
                                const Color(0xFF4A90E2),
                              ),
                              const SizedBox(width: 8),
                              _buildDot(
                                _dot2Anim,
                                const Color(0xFF4A90E2),
                              ),
                              const SizedBox(width: 8),
                              _buildDot(
                                _dot3Anim,
                                const Color(0xFF4A90E2),
                              ),
                            ],
                          ),
                        ],
                      ),
                    ),
                  ),
                ),
              );
            }
          }

          class WebViewPage extends StatefulWidget {
            const WebViewPage({super.key});

            @override
            State<WebViewPage> createState() => _WebViewPageState();
          }

          class _WebViewPageState extends State<WebViewPage>
              with WidgetsBindingObserver {
            late final WebViewController _controller;
            late final Connectivity _connectivity;
            StreamSubscription<List<ConnectivityResult>>?
                _connectivitySub;

            bool _dialogShown = false;

            @override
            void initState() {
              super.initState();

              WidgetsBinding.instance.addObserver(this);

              _connectivity = Connectivity();

              _controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setBackgroundColor(Colors.white)
                ..setNavigationDelegate(
                  NavigationDelegate(
                    onWebResourceError: (error) {
                      // Only show the dialog for errors affecting the
                      // main document. Images/ads/analytics errors should
                      // not interrupt the user.
                      if (error.isForMainFrame == true) {
                        _showNoConnectionDialog();
                      }
                    },
                  ),
                )
                ..loadRequest(
                  Uri.parse(r'$WEB_URL'),
                );

              _connectivitySub =
                  _connectivity.onConnectivityChanged.listen((results) {
                if (!mounted) return;

                final hasNetwork = results.any(
                  (result) => result != ConnectivityResult.none,
                );

                if (!hasNetwork) {
                  _showNoConnectionDialog();
                }
              });
            }

            @override
            void didChangeAppLifecycleState(AppLifecycleState state) {
              // Keep the WebView alive when the app is backgrounded.
              // Avoid unnecessary reloads when returning to the app.
              if (state == AppLifecycleState.resumed) {
                _dismissConnectionDialogIfNeeded();
              }
            }

            void _dismissConnectionDialogIfNeeded() {
              // Intentionally empty. The page should not reload just because
              // the Android activity becomes active again.
            }

            void _showNoConnectionDialog() {
              if (!mounted || _dialogShown) return;

              setState(() {
                _dialogShown = true;
              });

              showDialog<void>(
                context: context,
                barrierDismissible: false,
                builder: (dialogContext) => AlertDialog(
                  shape: RoundedRectangleBorder(
                    borderRadius: BorderRadius.circular(16),
                  ),
                  title: const Row(
                    children: [
                      Icon(Icons.wifi_off, color: Colors.red),
                      SizedBox(width: 8),
                      Text('Gagal Terhubung'),
                    ],
                  ),
                  content: const Text(
                    'Koneksi internet terputus. Periksa jaringan kamu dan coba lagi.',
                  ),
                  actions: [
                    TextButton(
                      onPressed: () async {
                        Navigator.of(dialogContext).pop();

                        if (!mounted) return;

                        setState(() {
                          _dialogShown = false;
                        });

                        await _controller.reload();
                      },
                      child: const Text('Coba Lagi'),
                    ),
                  ],
                ),
              );
            }

            @override
            void dispose() {
              WidgetsBinding.instance.removeObserver(this);
              _connectivitySub?.cancel();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return PopScope(
                canPop: false,
                onPopInvokedWithResult: (didPop, result) async {
                  if (didPop) return;

                  if (await _controller.canGoBack()) {
                    await _controller.goBack();
                  } else {
                    await SystemNavigator.pop();
                  }
                },
                child: Scaffold(
                  // No SafeArea here. Edge-to-edge lets WebView occupy
                  // the complete available display area.
                  body: WebViewWidget(
                    controller: _controller,
                  ),
                ),
              );
            }
          }
          DART

          # Replace shell placeholders safely after writing Dart.
          sed -i "s#r'\$APP_NAME'#'$APP_NAME'#g" myapp/lib/main.dart
          sed -i "s#r'\$WEB_URL'#'$WEB_URL'#g" myapp/lib/main.dart

      - name: Fix Android Permissions and App Name
        run: |
          APP_NAME="${{ github.event.inputs.app_name }}"
          MANIFEST="myapp/android/app/src/main/AndroidManifest.xml"
          
          sed -i '/<manifest xmlns:android/a\    <uses-permission android:name="android.permission.INTERNET"\/>' $MANIFEST
          sed -i '/<manifest xmlns:android/a\    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>' $MANIFEST
          sed -i "s/android:label=\"[^\"]*\"/android:label=\"$APP_NAME\"/" $MANIFEST

          # Make sure Android uses GPU rendering for the WebView.
          if grep -q '<application ' "$MANIFEST"; then
            sed -i 's/<application /<application android:hardwareAccelerated="true" /' "$MANIFEST"
          fi

      - name: Setup Network Security (Allow HTTP)
        run: |
          mkdir -p myapp/android/app/src/main/res/xml
          cat > myapp/android/app/src/main/res/xml/network_security_config.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
            <base-config cleartextTrafficPermitted="true">
              <trust-anchors>
                <certificates src="system"/>
              </trust-anchors>
            </base-config>
          </network-security-config>
          EOF
          
          sed -i 's/<application/<application android:networkSecurityConfig="@xml\/network_security_config"/' \
            myapp/android/app/src/main/AndroidManifest.xml

      - name: Optimize Android WebView Rendering
        run: |
          MANIFEST="myapp/android/app/src/main/AndroidManifest.xml"

          # Ensure the main activity is allowed to draw edge-to-edge.
          # The exact activity name is generated by Flutter as MainActivity.
          sed -i 's/android:exported="true"/android:exported="true" android:screenOrientation="unspecified"/' "$MANIFEST"

          # Android 12+ splash/theme compatibility is handled by Flutter.
          # Keep hardware acceleration enabled at application level.

      - name: Download and Sanitize Icon
        run: |
          mkdir -p myapp/assets/icon

          # Install ImageMagick without optional/recommended packages.
          # This avoids Ghostscript dependencies that can fail with a 404
          # when the Ubuntu runner mirror is temporarily out of sync.
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends imagemagick

          # Verify ImageMagick is available before processing the icon.
          command -v convert

          curl -fL \
            -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "${{ github.event.inputs.icon_url }}" \
            -o myapp/assets/icon/icon_raw

          # Mengubah gambar menjadi format PNG 1024x1024 yang valid
          convert myapp/assets/icon/icon_raw \
            -background transparent \
            -gravity center \
            -resize 1024x1024 \
            -extent 1024x1024 \
            myapp/assets/icon/icon.png

          # Stop the workflow immediately if the sanitized icon was not created.
          test -s myapp/assets/icon/icon.png

      - name: Write launcher icons config
        run: |
          cat > myapp/flutter_launcher_icons.yaml << 'EOF'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/icon/icon.png"
            min_sdk_android: 21
          EOF

      - name: Generate Icons
        run: |
          cd myapp
          dart run flutter_launcher_icons -f flutter_launcher_icons.yaml

      - name: Optimize Release Build
        run: |
          cd myapp

          # Keep release builds optimized and avoid unnecessary debug artifacts.
          flutter config --no-analytics

      - name: Build APK
        run: |
          cd myapp
          flutter clean
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: web2apk-release
          path: myapp/build/app/outputs/flutter-apk/app-release.apk